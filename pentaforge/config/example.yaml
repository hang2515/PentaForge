# =============================================================================
# PentaForge — 半自动英雄联盟高光剪辑配置文件
# =============================================================================
# 时间格式支持以下三种（可混用）：
#   HH:MM:SS.ms    例: "1:30:20.5"  → 1小时30分20.5秒
#   MM:SS.ms       例: "5:20.0"     → 5分20秒
#   原始秒数        例: 320.5        → 320.5秒
# =============================================================================

# ---------------------------------------------------------------------------
# 源视频 — 要剪辑的游戏录像文件路径（必填）
# ---------------------------------------------------------------------------
source: "gameplay.mp4"

# ---------------------------------------------------------------------------
# 输出视频 — 最终成品文件的保存路径
# ---------------------------------------------------------------------------
output: "highlight_output.mp4"

audio_enabled: true

# ---------------------------------------------------------------------------
# 背景音乐 (BGM) — 播放贯穿整个高光集锦的背景音乐（可选，留空则无背景音乐）
# ---------------------------------------------------------------------------
bgm: "bgm.mp3"

# BGM 音量 — 范围 0.0(静音) ~ 1.0(原始音量)，推荐 0.2 ~ 0.4
bgm_volume: 0.3

# ---------------------------------------------------------------------------
# 击杀音效 (SFX) — 按击杀类型映射到对应的音效文件
# 支持的击杀类型键名：
#   double_kill / triple_kill / quadra_kill / penta_kill
# 每个 clip 通过 kill_type 字段引用这里的音效
# （可选，未配置的音效类型不会被触发）
# ---------------------------------------------------------------------------
sfx:
  double_kill: "assets/sfx/double_kill.mp3"   # 双杀音效
  triple_kill: "assets/sfx/triple_kill.mp3"   # 三杀音效
  quadra_kill: "assets/sfx/quadra_kill.mp3"   # 四杀音效
  penta_kill:   "assets/sfx/penta_kill.mp3"   # 五杀音效

# SFX 音量 — 范围 0.0(静音) ~ 1.0(原始音量)，推荐 0.7 ~ 0.9
sfx_volume: 0.85

# ---------------------------------------------------------------------------
# 转场效果 — 多段剪辑之间的过渡动画
# ---------------------------------------------------------------------------
transitions:
  # 转场类型，可选值：
  #   fade / fadeblack / fadewhite  — 淡入淡出类
  #   dissolve                       — 溶解
  #   wipeleft / wiperight / wipeup / wipedown — 擦除类
  #   更多类型见 FFmpeg xfade 滤镜文档
  type: fade

  # 转场持续时间（秒），0 表示硬切无过渡
  duration: 0.3

# ---------------------------------------------------------------------------
# 导出设置 — 最终输出视频的编码参数
# ---------------------------------------------------------------------------
export:
  # 输出分辨率，格式为 "宽x高"，如 "1920x1080"、"1280x720"
  resolution: "1920x1080"

  # 输出帧率 (fps)，常见值：24、30、60
  fps: 60

  # 视频编码器，h264 兼容性最佳，h265/av1 体积更小但编码较慢
  # libx264 (h264) / libx265 (h265) / libsvtav1 (AV1)
  codec: "libx264"

  # 视频码率，控制画质与文件大小的平衡
  # 常用值：8M / 12M / 20M / 50M
  bitrate: "12M"

  # 编码预设，控制编码速度 vs 压缩率的取舍
  # ultrafast / superfast / veryfast / faster / fast
  # medium (平衡) / slow / slower / veryslow
  preset: "medium"

# ---------------------------------------------------------------------------
# 剪辑片段 — 定义要提取的高光时刻（至少一个）
# ---------------------------------------------------------------------------
clips:
  # --- 剪辑 1：三杀镜头 ---
  - start: "1:30.5"                 # 开始时间（必填）
    end:   "1:42.0"                 # 结束时间（必填）
    kill_type: "triple_kill"        # 击杀类型，对应上面 sfx 中的键名
    label: "First triple kill"      # 标签，用于日志输出（可选）
    # sfx_offset: 9.5               # SFX 在剪辑内的播放偏移（秒），默认自动放在接近结尾处
    # bgm: "special_bgm.mp3"        # 该剪辑专用的 BGM，覆盖全局 bgm 设置
    transition_after:               # 到下一段的转场；不写则使用上方默认转场
      type: fade
      duration: 0.3

  # --- 剪辑 2：五杀团战 ---
  - start: "5:20.0"
    end:   "5:35.0"
    kill_type: "penta_kill"
    label: "Pentakill teamfight"
    # 此剪辑未设置 sfx_offset，系统会自动将 SFX 放在剪辑末尾前 1 秒
    transition_after:
      type: wipeleft
      duration: 0.5

  # --- 剪辑 3：双杀（无标签、纯秒数写法）---
  - start: 145.0                    # 可直接写秒数
    end: 160.0
    kill_type: "double_kill"
    # label 省略时无日志标签

# ---------------------------------------------------------------------------
# 临时目录 — 存放处理过程中的中间文件（可选）
# 留空则使用系统默认临时目录，程序退出后自动清理
# ---------------------------------------------------------------------------
# temp_dir: "/tmp/pentaforge_work"
